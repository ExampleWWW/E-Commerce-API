[tool.ruff]
line-length = 110
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Игнорировать предупреждения вызовов функций в дефолтных аргументах (для FastAPI)

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true