services:
  db:
    image: postgres:16-alpine
    container_name: ecom_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"  # Внешний порт 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: ecom_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Важно: приложение внутри Docker обращается к базе по имени сервиса "db", а не "localhost"
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app  # Пробрасываем код проекта внутрь контейнера
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: